plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.securelink.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.securelink.app"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.0.2"
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // برای نصب‌بودن APK بدون ساخت کلید امضای اختصاصی، با کلید debug امضا می‌شود.
            // برای انتشار عمومی، خودتان یک keystore بسازید و این خط را حذف/جایگزین کنید.
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'

    // تست‌های واحد JVM (کدک سیم + رمزنگاری L2TP)
    testImplementation 'junit:junit:4.13.2'

    // موتور رسمی WireGuard (کاربرپسند GoBackend + پارسر کانفیگ)
    implementation 'com.wireguard.android:tunnel:1.0.20260102'

    // ذخیره‌سازی پروفایل‌ها به‌صورت JSON
    implementation 'com.google.code.gson:gson:2.11.0'
}
